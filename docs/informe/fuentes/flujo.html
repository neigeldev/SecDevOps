<text x="750" y="42" text-anchor="middle" font-size="28" font-weight="bold" fill="#1a237e">Flujo DevSecOps del proyecto: la salida de cada módulo es la entrada del siguiente</text>
<!-- boxes -->
<g>
<rect x="40" y="90" width="420" height="330" rx="16" fill="#e3f2fd" stroke="#1565c0" stroke-width="3"/>
