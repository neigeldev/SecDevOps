services:
  app:
    build: ../../app
    image: securenotes:v1
    ports:
      - "3000:3000"
    environment:
      DB_HOST: db
    depends_on:
      - db

  db:
    image: postgres:latest
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: securenotes
