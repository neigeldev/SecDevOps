# Reglas Semgrep propias (política como código) para SecureNotes.
# Complementan los rulesets del registro (p/owasp-top-ten, p/nodejs, ...) y
# funcionan sin conexión. Cada regla documenta CWE y categoría OWASP Top 10:2021.
rules:
  - id: sql-string-concatenation
    languages: [javascript]
    severity: ERROR
    message: >-
      Consulta SQL construida concatenando datos. Usa consultas parametrizadas
      (db.query('... $1', [valor])).
    metadata: { cwe: "CWE-89", owasp: "A03:2021 - Injection", confidence: HIGH }
    patterns:
      - pattern-either:
          - pattern: $DB.query("..." + $X, ...)
          - pattern: $DB.query($A + $X + $B, ...)
          - pattern: $DB.query(`...${$X}...`, ...)
          - pattern: |
              $SQL = "..." + $X + ...;
              ...
              $DB.query($SQL, ...);
          - pattern: |
              const $SQL = $A + $X + $B;
              ...
              $DB.query($SQL, ...);
      # Concatenar solo literales (para partir una consulta larga) es seguro
      - pattern-not: $DB.query("..." + "...", ...)
      - pattern-not: $DB.query("..." + "..." + "...", ...)

  - id: child-process-exec-user-input
    languages: [javascript]
    severity: ERROR
    message: >-
      child_process.exec ejecuta una shell con una cadena construida dinámicamente
      (inyección de comandos). Evita la shell o usa execFile con lista blanca.
    metadata: { cwe: "CWE-78", owasp: "A03:2021 - Injection", confidence: HIGH }
    patterns:
      - pattern-either:
          - pattern: exec("..." + $X, ...)
          - pattern: exec(`...${$X}...`, ...)
          - pattern: $CP.exec("..." + $X, ...)
          - pattern: $CP.execSync("..." + $X, ...)

  - id: weak-password-hash
    languages: [javascript]
    severity: ERROR
    message: >-
      MD5/SHA-1 no son aptos para almacenar contraseñas (rápidos y sin sal).
      Usa scrypt, Argon2id o bcrypt con sal aleatoria.
    metadata: { cwe: "CWE-916", owasp: "A02:2021 - Cryptographic Failures", confidence: HIGH }
    pattern-either:
      - pattern: crypto.createHash("md5")
      - pattern: crypto.createHash("sha1")

  - id: hardcoded-secret-in-config
    languages: [javascript]
    severity: ERROR
    message: >-
      Secreto o contraseña escrito en el código fuente. Léelo de un gestor de
      secretos o de variables de entorno / archivos montados.
    metadata: { cwe: "CWE-798", owasp: "A07:2021 - Identification and Authentication Failures", confidence: MEDIUM }
    patterns:
      - pattern-inside: |
          { ... }
      - pattern: |
          $KEY: "$VALUE"
      - metavariable-regex:
          metavariable: $KEY
          regex: (?i)^(password|passwd|pwd|secret|jwtSecret|apiKey|token)$
      - metavariable-regex:
          metavariable: $VALUE
          regex: ^.{3,}$

  - id: jwt-verify-without-algorithms
    languages: [javascript]
    severity: WARNING
    message: >-
      jwt.verify sin la opción 'algorithms' acepta el algoritmo que indique el token.
      Fija el algoritmo (p. ej. { algorithms: ['HS256'] }) y valida issuer/audience.
    metadata: { cwe: "CWE-347", owasp: "A07:2021 - Identification and Authentication Failures", confidence: HIGH }
    pattern: jwt.verify($TOKEN, $SECRET)

  - id: jwt-sign-without-expiration
    languages: [javascript]
    severity: WARNING
    message: El token JWT se firma sin expiración (expiresIn). Una sesión robada sería válida para siempre.
    metadata: { cwe: "CWE-613", owasp: "A07:2021 - Identification and Authentication Failures", confidence: HIGH }
    pattern: jwt.sign($PAYLOAD, $SECRET)

  - id: cookie-without-security-flags
    languages: [javascript]
    severity: WARNING
    message: La cookie se emite sin opciones (HttpOnly, Secure, SameSite).
    metadata: { cwe: "CWE-1004", owasp: "A05:2021 - Security Misconfiguration", confidence: HIGH }
    pattern: $RES.cookie($NAME, $VALUE)

  - id: mass-assignment-from-request-body
    languages: [javascript]
    severity: ERROR
    message: >-
      Se mezcla req.body completo en un objeto del modelo (asignación masiva):
      el cliente puede cambiar campos como 'role' o 'id'. Usa una lista blanca.
    metadata: { cwe: "CWE-915", owasp: "A01:2021 - Broken Access Control", confidence: HIGH }
    pattern-either:
      - pattern: _.merge($OBJ, req.body)
      - pattern: _.merge(..., req.body)
      - pattern: Object.assign($OBJ, req.body)

  - id: stack-trace-exposed-to-client
    languages: [javascript]
    severity: WARNING
    message: Se envía el stack trace al cliente. Registra el detalle en el servidor y responde un mensaje genérico.
    metadata: { cwe: "CWE-209", owasp: "A05:2021 - Security Misconfiguration", confidence: HIGH }
    pattern-either:
      - pattern: $RES.send(`...${$ERR.stack}...`)
      - pattern: $RES.send($ERR.stack)
      - pattern: '$RES.json({..., stack: $ERR.stack, ...})'

  - id: password-written-to-log
    languages: [javascript]
    severity: ERROR
    message: Se escribe una contraseña en los logs.
    metadata: { cwe: "CWE-532", owasp: "A09:2021 - Security Logging and Monitoring Failures", confidence: MEDIUM }
    patterns:
      - pattern-either:
          - pattern: console.log(`...${$PASSWORD}...`)
          - pattern: console.log(..., $PASSWORD, ...)
      - metavariable-regex:
          metavariable: $PASSWORD
          regex: (?i).*(password|passwd|pwd).*

  - id: ejs-unescaped-output
    languages: [generic]
    severity: ERROR
    message: >-
      Salida sin escapar en EJS (<%- ... %>) con datos que no son un include:
      permite XSS. Usa <%= ... %>.
    metadata: { cwe: "CWE-79", owasp: "A03:2021 - Injection", confidence: HIGH }
    paths:
      include: ["*.ejs"]
    pattern-regex: <%-(?!\s*include\b)[^%]+%>

  - id: express-missing-helmet
    languages: [javascript]
    severity: WARNING
    message: >-
      La aplicación Express no aplica cabeceras de seguridad (helmet) ni desactiva
      X-Powered-By.
    metadata: { cwe: "CWE-693", owasp: "A05:2021 - Security Misconfiguration", confidence: MEDIUM }
    patterns:
      - pattern: |
          $APP = express();
      - pattern-not-inside: |
          $APP = express();
          ...
          $APP.use(helmet(...));
      - pattern-not-inside: |
          $APP = express();
          ...
          $APP.disable('x-powered-by');
